base:
  config:
    mdb:
      dbname: seata

server:
  port: ${SERVER_PORT:9091}

spring:
  profiles:
    active: @profile.active@
    group:
      docker: local
  application:
    name: seata-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${base.config.mdb.hostname}:${base.config.mdb.port}/${base.config.mdb.dbname}?rewriteBatchedStatements=true&useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${base.config.mdb.username}
    password: ${base.config.mdb.password}
console:
  user:
    username: ${SEATA_CONSOLE_USERNAME:seata}
    password: ${SEATA_CONSOLE_PASSWORD:seata}

seata:
  server:
    service-port: ${SEATA_SERVER_SERVICE_PORT:8091}
  config:
    # support: nacos 、 consul 、 apollo 、 zk  、 etcd3
    type: ${SEATA_CONFIG_TYPE:nacos}
    nacos:
      server-addr: "${NACOS_SERVER_ADDR:127.0.0.1:${NACOS_SERVER_PORT:8848}}"
      namespace: ${NACOS_NAMESPACE:MACULA5}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      ##if use MSE Nacos with auth, mutex with username/password attribute
      #access-key: ""
      #secret-key: ""
      data-id: seata.properties
  registry:
    # support: nacos 、 eureka 、 redis 、 zk  、 consul 、 etcd3 、 sofa
    type: ${SEATA_REGISTRY_TYPE:nacos}
    preferred-networks: 30.240.*
    nacos:
      application: seata-server
      server-addr: "${NACOS_SERVER_ADDR:127.0.0.1:${NACOS_SERVER_PORT:8848}}"
      namespace: ${NACOS_NAMESPACE:MACULA5}
      cluster: default
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      group: SEATA_GROUP
  store:
    # support: file 、 db 、 redis
    mode: db
    session:
      mode: file
    lock:
      mode: file
    file:
      dir: sessionStore
      max-branch-session-size: 16384
      max-global-session-size: 512
      file-write-buffer-cache-size: 16384
      session-reload-read-size: 100
      flush-disk-mode: async
    db:
      datasource: druid
      db-type: mysql
      driver-class-name: com.mysql.jdbc.Driver
      url: jdbc:mysql://${base.config.mdb.hostname}:${base.config.mdb.port}/${base.config.mdb.dbname}?rewriteBatchedStatements=true&useSSL=false&allowPublicKeyRetrieval=true
      user: ${base.config.mdb.username}
      password: ${base.config.mdb.password}
      min-conn: 5
      max-conn: 100
      global-table: global_table
      branch-table: branch_table
      lock-table: lock_table
      distributed-lock-table: distributed_lock
      query-limit: 100
      max-wait: 5000
  security:
    secretKey: ${SEATA_SECRET_KEY:U2VhdGFMb2NhbERldmVsb3BtZW50U2VjcmV0S2V5MDEyMzQ1Njc4OQ==}
    tokenValidityInMilliseconds: 1800000
    ignore:
      urls: /,/**/*.css,/**/*.js,/**/*.html,/**/*.map,/**/*.svg,/**/*.png,/**/*.ico,/console-fe/public/**,/api/v1/auth/login
---
# local Profile 包含 IDE 本地开发所需的全部默认配置
spring:
  config:
    activate:
      on-profile: local
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
    locations: classpath:db/migration

logging:
  config: classpath:logback-spring.xml
  file:
    path: ${user.home}/logs/seata
  extend:
    logstash-appender:
      destination: ${LOGSTASH_DESTINATION:127.0.0.1:4560}
    kafka-appender:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
      topic: logback_to_logstash

base:
  config:
    mdb:
      hostname: 127.0.0.1
      port: ${MYSQL_PORT:3306}
      username: ${MYSQL_APP_USER:macula}
      password: ${MYSQL_APP_PASSWORD:macula}

---
# Docker Profile 覆盖容器内 DNS 连接信息，其余沿用 local 默认配置
spring:
  config:
    activate:
      on-profile: docker

base:
  config:
    mdb:
      hostname: mysql
      port: 3306
      username: ${MYSQL_APP_USER}
      password: ${MYSQL_APP_PASSWORD}
