server:
  port: ${SERVER_PORT:9010}

spring:
  profiles:
    active: @profile.active@
    group:
      docker: local
  application:
    name: macula-cloud-iam
  config:
    import:
      - optional:nacos:${spring.application.name}.yml?refreshEnabled=true
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yml?refreshEnabled=true
  cache:
    # 缓存类型 redis、none(不使用缓存)
    type: redis
  cloud:
    nacos:
      server-addr: ${spring.config.nacos.server-addr}
      namespace: ${spring.config.nacos.namespace}
      username: ${spring.config.nacos.username}
      password: ${spring.config.nacos.password}
      discovery:
        namespace: ${spring.cloud.nacos.namespace}
  servlet:
    encoding:
      force: true

macula:
  cloud:
    iam:
      playground:
        enabled: ${IAM_PLAYGROUND_ENABLED:false}
        allowed-profiles: ${IAM_PLAYGROUND_ALLOWED_PROFILES:}
        allow-loopback-http: ${IAM_PLAYGROUND_ALLOW_LOOPBACK_HTTP:false}
        client-secret: ${IAM_PLAYGROUND_CLIENT_SECRET:}
      signing-key:
        location: ${IAM_SIGNING_KEY_LOCATION:}
        alias: ${IAM_SIGNING_KEY_ALIAS:jose}
        password: ${IAM_SIGNING_KEY_PASSWORD:}
  security:
    ignore-urls:
      - /swagger-ui/index.html
      - /v3/api-docs/swagger-config

mybatis-plus:
  type-handlers-package: dev.macula.boot.starter.mp.handler

---
# local Profile 包含 IDE 本地开发所需的全部默认配置
spring:
  config:
    activate:
      on-profile: local
    nacos:
      server-addr: 127.0.0.1:${NACOS_SERVER_PORT:18848}
      namespace: ${NACOS_NAMESPACE:MACULA5}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
  cloud:
    sentinel:
      enabled: false
  datasource:
    url: jdbc:mysql://127.0.0.1:${MYSQL_PORT:13306}/macula-system?zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&autoReconnect=true
    username: ${MYSQL_APP_USER:macula}
    password: ${MYSQL_APP_PASSWORD:macula}
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: ${REDIS_PORT:16379}
      database: 0

macula:
  cloud:
    iam:
      issuer-uri: ${IAM_ISSUER_URI:http://127.0.0.1:${IAM_HOST_PORT:9010}}

mybatis-plus:
  configuration:
    # 这个配置会将执行的sql打印出来，在开发或测试的时候可以用
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

feign:
  httpclient:
    enabled: false
    max-connections: 200 # 线程池最大连接数，默认200
    time-to-live: 900 # 线程存活时间，单位秒，默认900
    connection-timeout: 2000  # 新建连接超时时间，单位ms, 默认2000
    follow-redirects: true # 是否允许重定向，默认true
    disable-ssl-validation: false # 是否禁止SSL检查， 默认false
    okhttp:
      read-timeout: 60s # 请求超时时间，Duration配置方式
  okhttp:
    enabled: true

seata:
  enabled: false

springdoc:
  api-docs:
    enabled: true  # 默认是true，用于开关API文档
  swagger-ui:
    enabled: true # 默认是true，用于开关API UI

logging:
  level:
    root: info
    dev.macula.cloud: debug
  file:
    name: ${user.home}/logs/${spring.application.name}/${spring.application.name}.log

---
# Docker Profile 覆盖容器内 DNS 连接信息，其余沿用 local 默认配置
spring:
  config:
    activate:
      on-profile: docker
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
      namespace: ${NACOS_NAMESPACE:MACULA5}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
  datasource:
    url: jdbc:mysql://mysql:3306/macula-system?zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&autoReconnect=true
    username: ${MYSQL_APP_USER}
    password: ${MYSQL_APP_PASSWORD}
  data:
    redis:
      host: redis
      port: 6379

macula:
  cloud:
    iam:
      issuer-uri: ${IAM_ISSUER_URI:http://macula-cloud-iam:9010}

---
# 共享环境只保留配置中心连接信息，其余配置由 Nacos Data ID 提供
spring:
  config:
    activate:
      on-profile: dev
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      namespace: ${NACOS_NAMESPACE:MACULA5}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}

