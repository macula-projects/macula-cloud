<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light"><meta name="referrer" content="same-origin">
  <title>登录 · Macula</title>
  <link rel="stylesheet" th:href="@{/iam/auth.css}" href="/iam/auth.css">
  <script th:src="@{/iam/auth.js}" src="/iam/auth.js" defer></script>
</head>
<body>
<main class="shell">
  <aside class="brand-panel" aria-label="Macula 统一身份平台">
    <div class="brand"><span class="brand-mark" aria-hidden="true">M</span>Macula</div>
    <div class="brand-content"><div class="eyebrow">ONE IDENTITY. CONNECTED WORK.</div>
      <h1>一个身份，<br>连接你的工作。</h1><p>以统一、安全的身份访问企业应用，<br>让每一次连接都简单可信。</p></div>
    <div class="orbit" aria-hidden="true"></div><div class="brand-meta">MACULA CLOUD · 统一身份平台</div>
  </aside>
  <section class="content-panel">
    <div class="brand mobile-brand"><span class="brand-mark" aria-hidden="true">M</span>Macula</div>
    <div class="card">
      <span class="step">统一身份认证</span><h1>欢迎回来</h1><p class="subtitle">使用你的企业账号登录，继续访问应用。</p>
      <div th:if="${enableCaptchaLogin}" class="tabs" role="tablist" aria-label="登录方式">
        <button class="tab" type="button" role="tab" data-tab="password-login" aria-selected="true" aria-controls="password-login">账号密码</button>
        <button class="tab" type="button" role="tab" data-tab="captcha-login" aria-selected="false" aria-controls="captcha-login">手机验证码</button>
      </div>
      <form id="password-login" data-login method="post" th:action="@{/login}">
        <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="error" role="alert" tabindex="-1"></div>
        <div class="form-field"><label for="username">账号</label><input class="text-input" id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="请输入你的账号" required></div>
        <div class="form-field"><label for="password">密码</label><div class="password-wrap">
          <input class="text-input" id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required>
          <button class="reveal" type="button" data-reveal="password" aria-controls="password" aria-pressed="false" aria-label="显示或隐藏密码">显示</button>
        </div></div>
        <button class="primary" type="submit">登录并继续 <span aria-hidden="true">&nbsp; →</span></button>
      </form>
      <form th:if="${enableCaptchaLogin}" id="captcha-login" data-login method="post" th:action="@{/login/captcha}" hidden>
        <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="error" role="alert" tabindex="-1"></div>
        <div class="form-field"><label for="phone">手机号码</label><input class="text-input" id="phone" name="phone" type="tel" autocomplete="tel" placeholder="请输入手机号码" required></div>
        <div class="form-field"><label for="captcha">验证码</label><input class="text-input" id="captcha" name="captcha" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="请输入已获取的验证码" required></div>
        <button class="primary" type="submit">验证并登录</button>
      </form>
      <p class="footnote">登录遇到问题？请联系你的企业管理员。</p>
    </div>
    <footer class="footer">Macula Cloud · 统一身份认证</footer>
  </section>
</main>
</body>
</html>
